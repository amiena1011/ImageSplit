name: image_split_pdf
description: "图片分割预览与PDF合成工具 - Flutter Windows+Android 跨端版"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0-89.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 文件选择与路径管理 (模块1/8)
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # 本地配置持久化 (模块8)
  shared_preferences: ^2.3.2

  # 状态管理
  provider: ^6.1.2

  # 图像处理 (模块2/4/5)
  image: ^4.2.0

  # Windows 桌面拖拽上传 (模块1)
  desktop_drop: ^0.4.4

  # PDF 解析渲染 - PDFium (模块5)
  # 注: pdfx 需在构建期下载 pdfium 二进制, 受网络/沙箱环境限制时以下接口可降级
  # pdfx: ^2.6.0

  # PDF 生成/合并导出 (模块4/5)
  pdf: ^3.11.1

  # 工具库
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 【顶层flutter配置，和dependencies同级，只保留这一处】
flutter:
  uses-material-design: true
  # 构建时排除PDF工具（仅Windows开发环境使用）
  assets:
    - tool/PDF转图片.exe
    - tool/PDF转图片.py