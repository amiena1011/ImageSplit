name: ImageSplit
description: "ImageSplit - Flutter Windows+Android 跨端版"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.14.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 文件选择与路径管理 (模块1/8)
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.8.0

  # 重要：锁定2.2.3，兼容Dart3.1~3.3；2.3.x需要Dart3.4，当前CI/本地都不满足
  shared_preferences: ^2.2.3

  # 状态管理
  provider: ^6.1.2

  # 图像处理 (模块2/4/5)
  image: ^4.2.0

  # Windows 桌面拖拽上传；windows编译报错就改成 ^0.5.0
  desktop_drop: ^0.4.4

  # PDF 解析渲染 - PDFium (模块5)
  # 注: pdfx 需在构建期下载 pdfium 二进制, 受网络/沙箱环境限制时以下接口可降级
  # pdfx: ^2.6.0

  # PDF 生成/合并导出 (模块4/5)
  pdf: ^3.11.1

  # 工具库
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - tool/PDF转图片.exe
    - tool/PDF转图片.py