name: ImageSplit
description: "ImageSplit - Flutter Windows+Android 跨端版"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <3.4.0'
  flutter: '>=3.14.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 文件选择与路径管理 (模块1/8)
  file_picker: ^8.0.5
  path_provider: ^2.1.4
  path: ^1.8.0

  # 本地配置持久化 (模块8)
  shared_preferences: ^2.2.3

  # 状态管理
  provider: ^6.1.2

  # 图像处理 (模块2/4/5)
  image: ^4.2.0

  # 【固定 0.4.4，绝对不要写0.5.0】
  desktop_drop: ^0.4.4

  # PDF 解析渲染 - PDFium (模块5)
  # pdfx: ^2.6.0

  # PDF 生成/合并导出 (模块4/5)
  pdf: ^3.11.1

  # 工具库
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - tool/PDF转图片.exe
    - tool/PDF转图片.py